name: Keepalive

# GitHub disables scheduled workflows after 60 days without repository
# activity. This commits a timestamp twice a month so the watcher never
# silently switches itself off.
on:
  schedule:
    - cron: '0 6 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%FT%TZ > .keepalive
          git config user.name  "keepalive"
          git config user.email "actions@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive" || exit 0
          git push
